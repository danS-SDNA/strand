<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Strand</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
:root{--bg:#fbf7ef;--ink:#1d1a16;--muted:#6f675c;--line:#e4dccd;--acc:#8a2f1d;--acc2:#2f5d8a;--chip:#efe7d6}
@media (prefers-color-scheme:dark){:root{--bg:#17150f;--ink:#efe8da;--muted:#a69d8d;--line:#332e25;--acc:#e07a5f;--acc2:#7fb0e0;--chip:#2a251c}}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 Georgia,"Iowan Old Style",serif}
#map{position:fixed;inset:0;z-index:0}
#top{position:fixed;top:0;left:0;right:0;z-index:5;padding:env(safe-area-inset-top) 10px 0;display:flex;gap:6px;align-items:center;pointer-events:none}
#top>*{pointer-events:auto}
#search{flex:1;margin-top:8px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;box-shadow:0 2px 8px rgba(0,0,0,.15);min-width:0}
.btn{margin-top:8px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15);white-space:nowrap}
.btn.acc{background:var(--acc);color:#fff;border-color:var(--acc)}
#journey{position:fixed;top:52px;left:0;right:0;z-index:5;display:flex;gap:6px;overflow-x:auto;padding:6px 10px;scrollbar-width:none}
#journey::-webkit-scrollbar{display:none}
.hop{flex:none;padding:4px 10px;border-radius:999px;background:var(--chip);border:1px solid var(--line);font-size:13px;cursor:pointer;white-space:nowrap;opacity:.85}
.hop.cur{opacity:1;border-color:var(--acc);font-weight:bold}
#panel{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.2);max-height:62vh;display:flex;flex-direction:column;transition:max-height .2s}
#panel.collapsed{max-height:56px}
#grip{flex:none;height:22px;display:flex;justify-content:center;align-items:center;cursor:pointer}
#grip::after{content:"";width:44px;height:5px;border-radius:3px;background:var(--line)}
#content{overflow-y:auto;padding:0 16px 24px}
@media(min-width:900px){#panel{left:auto;right:12px;bottom:12px;width:440px;max-height:calc(100vh - 110px);border-radius:16px}#panel.collapsed{max-height:56px}}
h1{font-size:22px;margin:4px 0 2px}h2{font-size:15px;margin:18px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:normal}
.sub{color:var(--muted);margin:0 0 8px}
a,.lnk{color:var(--acc2);text-decoration:none;cursor:pointer}.lnk:hover{text-decoration:underline}
.row{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.row .who{flex:1;min-width:0}.row .yrs{color:var(--muted);font-size:13px;white-space:nowrap}
.av{flex:none;width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--chip)}
.av.ph{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:18px}
.rel{font-size:13px;color:var(--acc)}
.tl{list-style:none;padding:0;margin:0;border-left:2px solid var(--line)}
.tl li{position:relative;padding:4px 0 8px 14px}
.tl li::before{content:"";position:absolute;left:-6px;top:11px;width:8px;height:8px;border-radius:50%;background:var(--muted)}
.tl li.here::before{background:var(--acc)}
.tl .yr{display:inline-block;min-width:44px;color:var(--muted);font-variant-numeric:tabular-nums}
.extract{margin:8px 0;overflow:hidden}.thumb{float:left;width:120px;max-height:160px;object-fit:cover;margin:2px 12px 6px 0;border-radius:8px}
.dim{color:var(--muted)}
.card{display:flex;gap:12px;align-items:center;padding:10px;margin:8px 0;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--chip)}
.card:hover{border-color:var(--acc)}
.arrow{flex:none;width:44px;height:44px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--acc)}
.card .d{font-size:13px;color:var(--muted)}.card b{display:block}
.card .ppl{font-size:13px}
.actions{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}
.actions .btn{margin:0;box-shadow:none}
.ic{flex:none;width:44px;height:44px;border-radius:8px;background:#b08556;display:flex;align-items:center;justify-content:center}.ic svg{width:28px;height:28px;fill:none;stroke:#1a1410;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:26px;height:26px;border-radius:6px;vertical-align:middle;display:inline-flex;margin-right:6px}.ic.sm svg{width:17px;height:17px;stroke-width:2}
.story{margin:8px 0 4px;padding:12px 14px;border-left:3px solid var(--acc);background:var(--chip);border-radius:0 10px 10px 0;font-size:15.5px;line-height:1.5}
.story .src{display:block;margin-top:6px;font-size:12px;color:var(--muted)}
.btn.on{border-color:var(--acc);color:var(--acc)}
#menu{position:fixed;top:52px;left:10px;z-index:8;width:min(340px,calc(100vw - 20px));background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.25);padding:12px 14px;display:none}
#menu.open{display:block}#menu h2{margin:10px 0 6px}#menu h2:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--chip);font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.chip.off{opacity:.4;text-decoration:line-through}.chip .ic{width:18px;height:18px;border-radius:4px}.chip .ic svg{width:12px;height:12px;stroke-width:2.2}
.sw{display:flex;align-items:center;justify-content:space-between;padding:6px 0;cursor:pointer}.sw i{width:40px;height:22px;border-radius:11px;background:var(--line);position:relative;flex:none}.sw i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on i{background:var(--acc)}.sw.on i::after{left:21px}.sw small{display:block;color:var(--muted)}
#toast{position:fixed;left:10px;right:10px;bottom:64px;z-index:9;background:var(--acc);color:#fff;padding:10px 14px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.3);display:none;cursor:pointer}#toast.show{display:block}
@media(min-width:900px){#toast{left:auto;right:12px;width:440px;bottom:auto;top:100px}}
.tease{font-size:13px;color:var(--muted);margin-top:2px}
.pulse{width:26px;height:26px;border-radius:50%;background:rgba(200,40,20,.35);border:2px solid #c8281a;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(.5);opacity:1}100%{transform:scale(2.2);opacity:0}}
.stop{width:28px;height:28px;border-radius:50%;background:#8a2f1d;color:#fff;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font:bold 13px Georgia,serif}
.num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:13px;margin-top:2px}
.mini{display:flex;gap:4px}.mini .btn{padding:3px 8px;font-size:13px}
.form input,.form textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;margin:4px 0}.form .cnt{font-size:12px;color:var(--muted);text-align:right}
.leg{font-size:12px;color:var(--muted);padding:0 0 4px 38px}
</style>
</head>
<body>
<div id="map"></div>
<div id="top"><button class="btn" id="menubtn" title="Menu">☰</button><input id="search" placeholder="Search a person or place…" autocomplete="off"><button class="btn" id="near" title="Near me">◎</button><button class="btn acc" id="lead" title="Lead me">➜ Lead me</button></div>
<div id="journey"></div>
<div id="menu"></div>
<div id="toast"></div>
<div id="panel"><div id="grip"></div><div id="content"><p class="sub">Loading London…</p></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
var D=null, byPlace={}, byPerson={}, markers={}, journey=[], visited={}, cur=null, cluster, hereMarker=null, lifeLine=null, lifeEvents=[], myPos=null, leadRadius=1.2, excluded={}, walkOn=false, walkWatch=null, alerted={}, lastAlert=0, wakeLock=null, selMarker=null, tourLayer=null, curated=[], activeTour=null, draft={name:'',desc:'',stops:[]}, myTours=[];
try{draft=JSON.parse(localStorage.getItem('strand.draft')||'null')||draft;myTours=JSON.parse(localStorage.getItem('strand.tours')||'[]')}catch(e){}
try{excluded=JSON.parse(localStorage.getItem('strand.excluded')||'{}')}catch(e){}
var GROUPS=[['monuments','Statues & memorials','statue',{statue:1,memorial:1,plaque:1}],['graves','Graves','grave',{grave:1}],['churches','Churches','church',{church:1}],['homes','Homes & palaces','house',{house:1,palace:1}],
 ['venues','Theatres & venues','theatre',{theatre:1}],['museums','Museums & libraries','museum',{museum:1}],['pubs','Pubs & hotels','pub',{pub:1}],['outdoors','Parks, streets & water','park',{park:1,street:1,water:1,bridge:1}],['other','Other buildings','building',{building:1,hospital:1,school:1,station:1}]];
function groupOf(k){for(var i=0;i<GROUPS.length;i++)if(GROUPS[i][3][k])return GROUPS[i][0];return 'other'}
function active(id){return !excluded[D.places[id].g]}
var map=L.map('map',{zoomControl:false}).setView([51.508,-0.128],13);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap · data Wikidata/Wikipedia'}).addTo(map);
L.control.zoom({position:'bottomleft'}).addTo(map);
function $(s){return document.querySelector(s)}
var content=$('#content'), panel=$('#panel');
$('#grip').onclick=function(){panel.classList.toggle('collapsed')};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function yrs(p){return (p.b||p.x)?((p.b||'?')+'–'+(p.x||'')):''}
function span(s,e){return (s||e)?(' '+(s||'')+((e&&e!==s)?'–'+e:'')):''}
function img(p,w){var f=p.i,ext=f.toLowerCase().split('.').pop(),sfx=ext==='svg'?'.png':(ext==='tif'||ext==='tiff'||ext==='pdf'||ext==='djvu'||ext==='webp')?'.jpg':'';return 'https://upload.wikimedia.org/wikipedia/commons/thumb/'+p.h[0]+'/'+p.h+'/'+encodeURIComponent(f)+'/'+w+'px-'+encodeURIComponent(f)+sfx}
function avatar(p){return p.i?'<img class="av" data-src="'+img(p,120)+'" alt="">':'<div class="av ph">◦</div>'}
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){var i=e.target;i.src=i.getAttribute('data-src');i.removeAttribute('data-src');io.unobserve(i)}})},{root:document.querySelector('#content'),rootMargin:'200px'});
new MutationObserver(function(){document.querySelectorAll('img[data-src]').forEach(function(i){io.observe(i)})}).observe(document.querySelector('#content'),{childList:true,subtree:true});
var ICONS={statue:'<path d="M9 21h6M10 21v-4h4v4M7 17h10M9 13l1-7h4l1 7M11 6V4h2v2"/>',
 memorial:'<path d="M5 21h14M8 21V9l4-5 4 5v12M12 10v7"/>',
 grave:'<path d="M6 21h12M8 21V9a4 4 0 0 1 8 0v12M10 12h4M12 10v6"/>',
 plaque:'<rect x="4" y="6" width="16" height="12" rx="1"/><path d="M8 10h8M8 13h6"/>',
 church:'<path d="M6 21V12l6-5 6 5v9M12 3v4M10 5h4M10 21v-5h4v5"/>',
 house:'<path d="M4 11l8-7 8 7M6 10v11h12V10M10 21v-6h4v6"/>',
 palace:'<path d="M4 21V9h3v3h3V8h4v4h3V9h3v12M10 21v-5h4v5M4 21h16"/>',
 theatre:'<path d="M4 6h16v12H4zM4 9h16M8 6v3M12 6v3M16 6v3M9 13h.01M15 13h.01M9.5 16c1.5 1 3.5 1 5 0"/>',
 museum:'<path d="M3 9l9-5 9 5M5 9v10M9 9v10M15 9v10M19 9v10M3 19h18M3 9h18"/>',
 pub:'<path d="M7 5h9v14H7zM16 9h3v6h-3M7 9h9"/>',
 hospital:'<path d="M5 21V5h14v16M5 21h14M12 8v6M9 11h6"/>',
 school:'<path d="M3 9l9-4 9 4-9 4-9-4zM7 11v5c0 1 2.5 2 5 2s5-1 5-2v-5M21 9v5"/>',
 station:'<path d="M7 4h10v12H7zM7 9h10M9 13h.01M15 13h.01M8 16l-2 4M16 16l2 4M7 20h10"/>',
 bridge:'<path d="M2 15h20M4 15V9M20 15V9M4 9c4-5 12-5 16 0M8 15v-4M12 15v-5M16 15v-4"/>',
 park:'<path d="M12 21v-5M12 16l-5-6h3L7 6h4L12 2l1 4h4l-3 4h3z"/>',
 street:'<path d="M6 21l3-18M18 21l-3-18M12 5v3M12 11v3M12 17v3"/>',
 water:'<path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/>',
 building:'<path d="M4 21V5h10v16M14 11h6v10M4 21h16M7 8h2M7 12h2M7 16h2M17 15h.01M17 18h.01"/>'};
var ICONRULES=[['grave',/cemetery|tomb|grave|mausoleum|crypt|catacomb/],['statue',/statue|bust|sculpture|relief|mural|obelisk|work of art|equestrian/],['water',/fountain|lake|pond|river|canal|dock|basin/],['plaque',/plaque/],['memorial',/memorial|monument|cenotaph/],
 ['hospital',/hospital|infirmary|asylum|clinic|hospice/],['church',/church|chapel|cathedral|abbey|synagogue|mosque|temple|priory|minster/],['school',/school|college|university|academy|institute|education|polytechnic/],['station',/station|railway|underground|tube/],['bridge',/bridge/],
 ['theatre',/theat|cinema|opera|concert|music venue|nightclub|music hall|playhouse/],['museum',/museum|gallery|library|archive/],['pub',/\bpub\b|public house|inn\b|tavern|restaurant|hotel|club|shop|cafe|coffee/],['palace',/palace|castle|court|parliament|government|town hall|guildhall/],
 ['park',/park|garden|square|common|heath|green\b|wood/],['street',/street|road|lane|avenue|alley|mews|row\b|crescent|place\b|terrace/],['house',/house|home|residence|mansion|villa|apartment|flat|cottage|lodge/]];
function iconOf(pl){var t=(pl.t||[]).join(' | ').toLowerCase()+' | '+(pl.d||'').toLowerCase();for(var i=0;i<ICONRULES.length;i++)if(ICONRULES[i][1].test(t))return ICONRULES[i][0];return 'building'}
function icon(pl,sm){return '<span class="ic'+(sm?' sm':'')+'" title="'+esc((pl.t||[])[0]||'')+'"><svg viewBox="0 0 24 24">'+ICONS[iconOf(pl)]+'</svg></span>'}
var RELTEXT={commemorated:'commemorated here',depicted:'depicted here',buried:'buried here',died:'died here',born:'born here',lived:'lived here',designed:'designed this','named after':'gives it its name',founded:'founded it',commissioned:'commissioned it',made:'made it',owned:'owned it'};
function link(kind,id,label,ctx){return '<span class="lnk" data-go="'+kind+'/'+id+(ctx?'/'+ctx:'')+'">'+esc(label)+'</span>'}
document.addEventListener('click',function(e){var t=e.target.closest('[data-go]');if(t){location.hash='#'+t.getAttribute('data-go');return}
  var f=e.target.closest('[data-fly]');if(f){fly(+f.getAttribute('data-fly'));return}
  var a=e.target.closest('[data-act]');if(a){act(a.getAttribute('data-act'),a)}});

fetch('data/index.json').then(function(r){return r.json()}).then(function(d){
  D=d;
  d.links.forEach(function(l){(byPlace[l.pl]=byPlace[l.pl]||[]).push(l);(byPerson[l.pe]=byPerson[l.pe]||[]).push(l)});
  cluster=L.markerClusterGroup({disableClusteringAtZoom:17,maxClusterRadius:50,chunkedLoading:true});
  Object.keys(d.places).forEach(function(id){var p=d.places[id];p.g=groupOf(iconOf(p));
    var m=L.marker([p.lat,p.lon],{title:p.l});m.on('click',function(){location.hash='#l/'+id});markers[id]=m});
  map.addLayer(cluster);refreshPins();renderMenu();
  if(localStorage.getItem('strand.loc')==='1')locate(false);
  fetch('data/tours.json').then(function(r){return r.ok?r.json():[]}).then(function(t){curated=t.filter(function(x){return x.stops.every(function(i){return D.places[i]})});renderMenu()}).catch(function(){}).then(route);
});
window.addEventListener('hashchange',route);
function refreshPins(){cluster.clearLayers();cluster.addLayers(Object.keys(D.places).filter(active).map(function(id){return markers[id]}))}
function renderMenu(){$('#menu').innerHTML='<div class="sw'+(walkOn?' on':'')+'" data-act="walk"><span>Walk with me<small>Speaks up when you pass somewhere worth a stop</small></span><i></i></div>'+
  '<h2>Show</h2><div class="chips">'+GROUPS.map(function(g){return '<span class="chip'+(excluded[g[0]]?' off':'')+'" data-act="cat:'+g[0]+'"><span class="ic"><svg viewBox="0 0 24 24">'+ICONS[g[2]]+'</svg></span>'+g[1]+'</span>'}).join('')+'</div>'+
  '<h2>Tours</h2>'+curated.map(function(t){return '<div class="row"><span class="who">'+link('t',t.id,t.name)+'<br><span class="dim">'+t.stops.length+' stops</span></span></div>'}).join('')+
  myTours.map(function(t,i){return '<div class="row"><span class="who">'+link('t','m'+i,t.name)+'<br><span class="dim">'+t.stops.length+' stops · mine</span></span></div>'}).join('')+
  '<div class="actions" style="margin-top:8px"><button class="btn" data-act="tour-open">'+(draft.stops.length?'✎ Tour in progress ('+draft.stops.length+')':'+ New tour')+'</button></div>'+
  '<div class="actions" style="margin-top:12px"><button class="btn" data-act="forget">Forget where I have been</button></div>'}
$('#menubtn').onclick=function(){$('#menu').classList.toggle('open')};
document.addEventListener('click',function(e){if(!e.target.closest('#menu,#menubtn'))$('#menu').classList.remove('open')});
function route(){if(!D)return;var h=location.hash.slice(1).split('/');
  if(h[0]==='p'&&D.people[h[1]])showPerson(h[1],h[2]);else if(h[0]==='l'&&D.places[h[1]])showPlace(h[1]);else if(h[0]==='t')showTour(h.slice(1).join('/'));else showHome()}
function hop(kind,id,label){var k=kind+'/'+id;if(kind==='l')visited[id]=1;if(journey.length&&journey[journey.length-1].k===k)return;
  journey.push({k:k,kind:kind,id:id,label:label});if(journey.length>40)journey.shift();
  $('#journey').innerHTML=journey.map(function(j,i){return '<span class="hop'+(i===journey.length-1?' cur':'')+'" data-go="'+j.kind+'/'+j.id+'">'+(j.kind==='p'?'👤 ':'📍 ')+esc(j.label)+'</span>'}).join('');
  $('#journey').scrollLeft=1e6}
function byFame(a,b){return (b.p.f||0)-(a.p.f||0)||((a.p.x||a.p.b||3000)-(b.p.x||b.p.b||3000))}
function placePeople(id){var seen={},out=[];
  (byPlace[id]||[]).forEach(function(l){var p=D.people[l.pe];if(!p)return;var o=seen[l.pe];if(!o){o={id:l.pe,p:p,rels:[]};seen[l.pe]=o;out.push(o)}o.rels.push(RELTEXT[l.r]+span(l.s,l.e))});
  out.sort(byFame);return out}
function personRow(id,ctx,rels){var p=D.people[id];return '<div class="row">'+avatar(p)+'<span class="who">'+link('p',id,p.l,ctx)+(rels?'<br><span class="rel">'+rels.join(' · ')+'</span>':'')+(p.d?'<br><span class="dim">'+esc(p.d)+'</span>':'')+'</span><span class="yrs">'+yrs(p)+'</span></div>'}
function showHome(){panel.classList.remove('collapsed');
  if(myPos){aroundYou();return}
  var STRONG={buried:1,died:1,born:1,lived:1,commemorated:1};var top=Object.keys(D.people).filter(function(i){return (byPerson[i]||[]).some(function(l){return STRONG[l.r]})}).map(function(i){return {id:i,p:D.people[i]}}).sort(byFame).slice(0,8);
  content.innerHTML='<h1>Strand · London</h1><p class="sub">'+Object.keys(D.places).length+' places, '+Object.keys(D.people).length+' people. Tap a pin, press ◎ for what is around you, or ➜ Lead me to be taken somewhere. Follow a life, or change to someone it crossed.</p>'+
   '<div class="actions"><button class="btn acc" data-act="locate">◎ What is around me</button></div><h2>Start with</h2>'+top.map(function(o){return personRow(o.id)}).join('')}
/* Around you: the home page once location is allowed. Distance order, story teasers, no typing needed. */
function aroundYou(){var la=myPos[0],lo=myPos[1];cur=null;panel.classList.remove('collapsed');
  content.innerHTML='<h1>Around you</h1><div class="actions"><button class="btn acc" data-act="lead">➜ Lead me</button><button class="btn" data-act="locate">◎ Refresh</button></div>'+nearby(la,lo,20);
  content.scrollTop=0;teasers()}

      $('#wiki').innerHTML=(pic?'<img class="thumb" src="'+pic+'" alt="">':'')+esc(w.extract||'')+' <a target="_blank" href="'+w.content_urls.desktop.page+'">Wikipedia ↗</a>'}).catch(function(){$('#wiki').querySelector('.dim').textContent=''});
  else $('#wiki').querySelector('.dim').innerHTML='No English Wikipedia article. <a target="_blank" href="https://www.wikidata.org/wiki/'+id+'">Wikidata ↗</a>';
  fetch('data/people/'+id+'.json').then(function(r){return r.json()}).then(function(x){if(cur.id!==id)return;
    var ev=x.ev.map(function(e){return {y:e.s||e.w||(e.k==='born'?p.b:(e.k==='died'||e.k==='buried')?p.x:null),k:e.k,l:e.l,pl:e.pl,lat:e.lat,lon:e.lon,s:e.s,e:e.e,inLondon:e.in}})
      .concat(x.pos.map(function(q){return {y:q.s,k:'held',l:q.l,s:q.s,e:q.e}}));
    if(p.b&&!ev.some(function(e){return e.k==='born'}))ev.push({y:p.b,k:'born',l:''});
    if(p.x&&!ev.some(function(e){return e.k==='died'}))ev.push({y:p.x,k:'died',l:''});
    var order={born:0,studied:1,lived:2,'worked at':3,'worked in':3,held:4,died:8,buried:9};
    ev.sort(function(a,b){return ((a.y==null?9999:a.y)-(b.y==null?9999:b.y))||((order[a.k]||5)-(order[b.k]||5))});
    var seenEv={};ev=ev.filter(function(e){var k=[e.y,e.k,e.l].join('|');if(seenEv[k])return false;seenEv[k]=1;return true});
    lifeEvents=ev;
    $('#life').className='';$('#life').innerHTML='<ul class="tl">'+ev.map(function(e,i){
      var where=e.l?(e.lat!=null?' <span class="lnk" data-fly="'+i+'">'+esc(e.l)+'</span>':' '+esc(e.l)):'';
      return '<li'+(e.inLondon?' here':'')+'><span class="yr">'+(e.y==null?'':e.y)+'</span>'+esc(e.k)+where+((e.e&&e.e!==e.y)?' <span class="dim">until '+e.e+'</span>':'')+(e.inLondon?' · '+link('l',e.pl,'people here'):'')+'</li>'}).join('')+'</ul>';
    var as=x.as.slice().sort(function(a,b){return (b.in?1:0)-(a.in?1:0)||((b.in&&D.people[b.id].f||0)-(a.in&&D.people[a.id].f||0))});
    $('#assoc').className='';$('#assoc').innerHTML=as.length?as.map(function(a){return '<div class="row">'+(a.in?avatar(D.people[a.id]):'')+'<span class="who">'+(a.in?link('p',a.id,a.l):'<span class="dim">'+esc(a.l)+'</span>')+' <span class="rel">'+esc(a.r)+'</span></span>'+(a.in?'<span class="yrs">→ strand</span>':'')+'</div>'}).join(''):'<span class="dim">No recorded relations.</span>';
    var pts=ev.filter(function(e){return e.lat!=null});
    if(lifeLine)map.removeLayer(lifeLine);
    if(pts.length>1){lifeLine=L.polyline(pts.map(function(e){return [e.lat,e.lon]}),{color:'#8a2f1d',weight:2,dashArray:'4 6',opacity:.7}).addTo(map)}
  });
  var ctx=ctxPlace&&D.places[ctxPlace];if(ctx)map.flyTo([ctx.lat,ctx.lon],Math.max(map.getZoom(),15),{duration:.6});
}
function fly(i){var e=lifeEvents[i];if(!e)return;map.flyTo([e.lat,e.lon],e.inLondon?16:10,{duration:1});
  if(hereMarker)map.removeLayer(hereMarker);
  if(!e.inLondon){hereMarker=L.circleMarker([e.lat,e.lon],{radius:9,color:'#8a2f1d'}).addTo(map).bindPopup(esc(e.k+' · '+e.l)).openPopup()}}
$('#near').onclick=function(){locate(true)};
$('#search').oninput=function(){var q=this.value.trim().toLowerCase();if(q.length<2||!D)return;panel.classList.remove('collapsed');
  var pp=Object.keys(D.people).filter(function(i){return D.people[i].l&&D.people[i].l.toLowerCase().indexOf(q)>=0}).map(function(i){return {id:i,p:D.people[i]}}).sort(byFame).slice(0,25);
  var ll=Object.keys(D.places).filter(function(i){return active(i)&&D.places[i].l&&D.places[i].l.toLowerCase().indexOf(q)>=0}).slice(0,15);
  content.innerHTML='<h2>Places</h2>'+ll.map(function(i){return '<div class="row">'+icon(D.places[i])+'<span class="who">'+link('l',i,D.places[i].l)+'</span><span class="yrs">'+(byPlace[i]||[]).length+'</span></div>'}).join('')+
   '<h2>People</h2>'+pp.map(function(o){return personRow(o.id)}).join('')};
</script>
</body>
</html>
